version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  game-server:
    build: .
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
