<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape" />
  <title>بیلیارد ۸ توپ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; height: 100%; overflow: hidden; 
      background: #0a0a1a; touch-action: none;
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
      position: fixed; top: 0; left: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #game-container { 
      width: 100%; height: 100%;
      direction: ltr;
    }
    canvas { display: block; touch-action: none; }

    /* Loading screen — shown until Phaser bootstraps */
    #loading-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 100;
      background: linear-gradient(135deg, #0a0a1a 0%, #16213e 50%, #1a1a2e 100%);
      color: #fff;
    }
    #loading-screen .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.08);
      border-top-color: #f97316; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-screen p { font-size: 14px; opacity: 0.6; }

    /* Orientation lock overlay — shown on portrait mobile */
    #rotate-overlay {
      position: fixed; inset: 0; display: none; z-index: 200;
      flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0a0a1a, #16213e);
      color: #fff; text-align: center; direction: rtl;
    }
    #rotate-overlay .icon {
      font-size: 64px; margin-bottom: 20px;
      animation: rotate-phone 2s ease-in-out infinite;
    }
    @keyframes rotate-phone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }
    #rotate-overlay h2 {
      font-size: 22px; font-weight: bold; margin-bottom: 8px;
    }
    #rotate-overlay p {
      font-size: 13px; opacity: 0.6;
    }

    /* Portrait suggestion — soft, doesn't hide content */
    @media (orientation: portrait) and (max-width: 768px) {
      #rotate-overlay { display: flex; }
    }
  </style>
  <script type="module" crossorigin src="./assets/index-CCBzcWJH.js"></script>
</head>
<body>
  <div id="rotate-overlay">
    <div class="icon">📱</div>
    <h2>لطفاً دستگاه را بچرخانید</h2>
    <p>حالت افقی برای تجربه بهتر</p>
  </div>
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>در حال بارگذاری بیلیارد ۸ توپ...</p>
  </div>
  <div id="game-container"></div>
</body>
</html>
